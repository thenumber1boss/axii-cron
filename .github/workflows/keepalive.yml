# GitHub switches off scheduled workflows in a public repo after 60 days without repository activity.
# This job re-enables the cron workflow once a month so it never silently stops.
#
# Needs one extra secret: KEEPALIVE_TOKEN, a fine-grained personal access token limited to THIS
# repository with "Actions: Read and write". (The built-in GITHUB_TOKEN is not allowed to do this.)
# Fine-grained tokens expire: put the expiry date in your calendar and renew it.
name: Keep cron alive

on:
  schedule:
    - cron: '20 0 1 * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-enable the cron workflow
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh api -X PUT "repos/$REPO/actions/workflows/cron.yml/enable"
          echo "cron.yml enabled"